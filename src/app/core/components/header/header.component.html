<header class="w-full bg-white shadow-xs border-b border-gray-100 sticky top-0 z-50">
  <!-- Cintillo de envíos a nivel nacional -->
  <div class="w-full bg-hazlotu-dark text-white text-[11px] font-bold tracking-widest text-center py-2 uppercase px-4">
    🚀 Sube tu imagen, diseña tu prenda y recíbela en casa. Envío a todo el Perú.
  </div>

  <!-- Barra de navegación principal -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
    
    <!-- Contenedor del Logo con Imagen Auténtica -->
    <div class="flex items-center cursor-pointer select-none">
      <img 
        src="assets/images/logo-hazlotu.png" 
        alt="HazloTu.pe - Personalización de Prendas" 
        class="h-[52px] sm:h-[65px] md:h-[72px] w-auto object-contain transition-transform duration-200 hover:scale-[1.02]"
        style="filter: drop-shadow(1px 0px 0px #111827) drop-shadow(-1px 0px 0px #111827) drop-shadow(0px 1px 0px #111827) drop-shadow(0px -1px 0px #111827);" />
    </div>

    <!-- 🌟 MENÚ DE NAVEGACIÓN INTERMEDIO TOTALMENTE INTERACTIVO Y CON VIDA -->
    <nav class="hidden md:flex space-x-8 text-sm font-bold text-gray-600">
      
      <!-- Opción 1: Simulador -->
      <a (click)="clickMenu('simuladorSeccion')" 
        class="relative py-2 text-gray-700 hover:text-orange-600 transition-colors cursor-pointer group select-none">
        <span>Simulador</span>
        <span class="absolute bottom-0 left-0 w-full h-0.5 bg-orange-600 scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-left"></span>
      </a>

      <!-- Opción 2: Galería de Stock -->
      <a (click)="clickMenu('catalogoSeccion')" 
        class="relative py-2 text-gray-700 hover:text-orange-600 transition-colors cursor-pointer group select-none">
        <span>Galería de Stock</span>
        <span class="absolute bottom-0 left-0 w-full h-0.5 bg-orange-600 scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-left"></span>
      </a>

      <!-- Opción 3: ¿Cómo funciona? -->
      <a (click)="clickMenu('pasosSeccion')" 
        class="relative py-2 text-gray-700 hover:text-orange-600 transition-colors cursor-pointer group select-none">
        <span>¿Cómo funciona?</span>
        <span class="absolute bottom-0 left-0 w-full h-0.5 bg-orange-600 scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-left"></span>
      </a>

    </nav>

    <!-- 🌟 LOGO DE WHATSAPP SOPORTE EN LUGAR DEL CARRITO -->
    <!-- Como la tienda es directa a WhatsApp, este acceso directo genera mayor confianza en tus clientes -->
    <a href="https://wa.me?text=%C2%A1Hola%20HazloT%C3%BA%21%20%F0%9F%91%8B%20Estoy%20en%20la%20p%C3%A1gina%20web%20y%20tengo%20una%20consulta%20sobre%20los%20pedidos%20personalizados." 
      target="_blank" 
      class="relative cursor-pointer p-2.5 rounded-xl bg-green-50 hover:bg-green-100 border border-green-200 text-green-600 flex items-center justify-center transition-all transform active:scale-95">
      
      <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24" xmlns="http://w3.org">
        <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397.079 11.948.079c3.173.001 6.154 1.24 8.396 3.487 2.242 2.246 3.476 5.23 3.475 8.41-.003 6.595-5.339 11.866-11.89 11.866c-2.015-.001-4.004-.515-5.772-1.493L0 24zm6.09-4.379l.38.225c1.58.938 3.515 1.433 5.485 1.434 5.514 0 10.003-4.405 10.006-9.822.002-2.624-1.013-5.091-2.863-6.945-1.85-1.855-4.31-2.876-6.93-2.877-5.518 0-10.01 4.407-10.014 9.822-.001 1.948.514 3.85 1.493 5.433l.247.4l-.997 3.637 3.73-.967z"/>
      </svg>
    </a>

  </div>
</header>
